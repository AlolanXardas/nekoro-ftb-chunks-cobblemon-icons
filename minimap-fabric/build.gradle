plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java-library'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://artefacts.cobblemon.com/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.blamejared.com/' }
    // amecs-key-modifiers: a transitive dependency of FTB Library since 2101.1.35
    maven { url = 'https://maven.siphalor.de/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.mc_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // FTB Library: the Icon<?> interface and the ImageIcon class
    modCompileOnly "dev.ftb.mods:ftb-library-fabric:${project.ftb_library_version}"
    // FTB Chunks: the mixin target (EntityIconLoader)
    modCompileOnly "dev.ftb.mods:ftb-chunks-fabric:${project.ftb_chunks_version}"
    // Cobblemon: the PokemonEntity class
    modCompileOnly "com.cobblemon:fabric:${project.cobblemon_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : 'xardas',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'xardas'
        ])
    }
}
