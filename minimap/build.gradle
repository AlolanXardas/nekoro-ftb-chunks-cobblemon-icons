plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client { }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // FTBLibrary — interfejs Icon<?> + klasa ImageIcon
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    // FTBChunks — cel Mixina (EntityIconLoader)
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    // Cobblemon — klasa PokemonEntity
    compileOnly "com.cobblemon:neoforge:${cobblemon_version}"
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://artefacts.cobblemon.com/releases' }
    maven { url = 'https://maven.architectury.dev/' }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : 'xardas',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : 'xardas'
        ])
    }
}

